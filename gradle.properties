org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NeoGradle is not configuration-cache compatible.
org.gradle.configuration-cache=false

# Parchment mappings -- https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Compiled against 21.1.248 (what is cached locally); the mods.toml range accepts any 21.1.x,
# so the jar loads on the pack's 21.1.236. Nothing here touches an API newer than 21.1.0.
neo_version=21.1.248
loader_version_range=[1,)

## Create + ecosystem -- compile-time only, all guarded by ModList checks at runtime.
# Only ProcessingRecipe and HeatCondition are actually referenced, but Create's own API hands
# back Registrate types in signatures, so Registrate has to be resolvable for javac.
# catnip ships shaded inside ponder, not as the standalone (stale) Catnip-NeoForge artifact.
create_version=6.0.10-281
registrate_version=MC1.21-1.3.0+67
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6

## JEI
# This mod mixins JEI *internals* (mezz.jei.gui.search / mezz.jei.core.search), which the
# published -api artifacts do not contain. So we compile against the full production jar in
# libs/, copied out of the instance -- that pins us to the exact build the pack runs and keeps
# the mixin targets honest. Bump both together.
jei_version=19.27.0.340

## Modern Industrialization
# Vendored in libs/ for the same reason JEI is: MachineRecipe's fields are implementation detail,
# not published API, and pinning to the pack's exact jar is what keeps the adapter honest.
mi_version=2.4.2

## Mod
mod_id=processsearch
mod_name=Process Search
mod_license=MIT
mod_version=0.3.0
mod_group_id=dev.processsearch
mod_authors=
mod_description=Search JEI by machine and by recipe facet, and follow a chain on a process tree. Four filter prefixes: > made by, < used in, * machine for, ~ item class.
